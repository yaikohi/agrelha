apiVersion: v1
kind: Service
metadata:
  name: {{ include "agrelha.fullname" . }}
  labels: {{- include "agrelha.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "agrelha.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
