{{/*
One Role+RoleBinding per managed namespace. agrelha is deliberately never given
cluster-wide permissions: it can read pods/logs/metrics and scale or patch
deployments, in the game namespaces only. ConfigMaps are read-only because edits
travel through the declarative plane, not the API.
*/}}
{{- range .Values.gameNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agrelha.fullname" $ }}-ops
  namespace: {{ . }}
  labels: {{- include "agrelha.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agrelha.fullname" $ }}-ops
  namespace: {{ . }}
  labels: {{- include "agrelha.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agrelha.fullname" $ }}-ops
subjects:
  - kind: ServiceAccount
    name: {{ include "agrelha.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
