root = "."
tmp_dir = "tmp"
[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/agrelha"
  delay = 200 # debounce rapid file writes from templ
  exclude_dir = ["assets", "tmp", "vendor", "node_modules"]
  exclude_regex = ["_test.go", ".*_templ.go"]
  include_ext = ["go", "templ", "html", "css"]
  log = "build-errors.log"
  stop_on_error = true

[log]
  main_only = false
  time = false
