# Hearth — design tokens, reconciled
#
# One export covering BOTH sources that define Hearth: the Penpot design file
# and the shipping CSS. Neither is a superset of the other, so every token
# carries where it lives and whether the two agree.
#
# status      agreed      | same value in Penpot and in code
#             conflict    | in both, values disagree — read `conflict`
#             design-only | in Penpot, absent from code
#             code-only   | in code, absent from Penpot
# ships_as    css-var     | a custom property declared in input.css @theme
#             observed    | real in the code as literals/Tailwind utilities, not a var
#             none        | design-side only, nothing in the product yet
#
# `penpot` and `css_var` give the token's spelling on each side. drift.md notes
# a rename at every hop checked at none; this file is the mapping.

[meta]
name = "Hearth"
version = 2
exported = "2026-11-06"
reconciles = ["penpot", "code"]
primary_theme = "dark"
themes = ["dark", "light"]

[source.penpot]
role = "design source of truth"
file = "Agrelha - Website"
sets = "hearth-dark (46 tokens) + hearth-light (17, a name-parity colour overlay)"
verified = "2026-11-06 — read live via Penpot MCP, 63/63 values confirmed"

[source.code]
role = "what actually ships"
file = "internal/web/assets/css/input.css"
declares = "17 colours x 2 themes, 2 font families, 1 radius — 20 custom properties"
note = "everything else below marked `observed` is real in the code but not a custom property"

