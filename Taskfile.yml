version: "3"

vars:
  CSS_IN: internal/web/assets/css/input.css
  CSS_OUT: internal/web/assets/css/output.css
  DATASTAR_JS: internal/web/assets/js/datastar.js
  DATASTAR_VERSION: 1.0.2 # must match datastar-go protocol (PatchElements/PatchSignals)
  GO_MAIN: cmd/agrelha/main.go
  GO_BINARY: main
  VERSION: dev
  IMAGE: registry.ykhi.xyz/agrelha
  TAG_PREFIX: v
  GIT_REMOTE: origin
  # Both fall back to a placeholder inside the container image build, where
  # .dockerignore keeps .git out of the context.
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  DIRTY:
    sh: test -z "$(git status --porcelain 2>/dev/null)" && echo "" || echo "-dirty"
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  default:
    desc: "Build the app and run tests"
    cmds:
      - task: build
      - task: test

  setup:
    desc: "Install missing mise tools (go, bun, templ, air)"
    cmds:
      - mise install
    status:
      - mise status --missing
    sources:
      - mise.toml

  # --- Build ---
  build:
    desc: "Generate assets + templ and compile the Go binary"
    deps: [setup, go:build]

  go:build:
    desc: "templ generate + go build"
    deps: [tailwind:build, assets:datastar]
    # Deliberately not fingerprinted with sources/generates. The stamped version
    # is an input that no source file records, so a fingerprint would report
    # "up to date" and hand back a binary labelled `dev` after you asked for a
    # release. Go's own build cache already makes the repeat build cheap.
    cmds:
      - templ generate
      - >-
        CGO_ENABLED=0 go build -trimpath
        -ldflags "-s -w
        -X agrelha/internal/platform/build.Version={{.VERSION}}
        -X agrelha/internal/platform/build.Commit={{.COMMIT}}{{.DIRTY}}
        -X agrelha/internal/platform/build.Date={{.BUILD_DATE}}"
        -o {{.GO_BINARY}} {{.GO_MAIN}}

  version:
    desc: "Print what a build would stamp right now"
    silent: true
    cmds:
      - 'echo "version={{.VERSION}} commit={{.COMMIT}}{{.DIRTY}} date={{.BUILD_DATE}}"'

  tailwind:build:
    desc: "Build Tailwind CSS (v4 CLI)"
    deps: [setup, tailwind:deps]
    cmds:
      - bunx @tailwindcss/cli -i {{.CSS_IN}} -o {{.CSS_OUT}} --minify

  tailwind:deps:
    desc: "Install node modules with bun"
    deps: [setup]
    cmds:
      - bun install
    sources:
      - "package.json"
    generates:
      - "bun.lock"

  assets:datastar:
    desc: "Vendor the pinned Datastar browser bundle (no CDN at runtime)"
    cmds:
      - curl -fsSL "https://cdn.jsdelivr.net/gh/starfederation/datastar@v{{.DATASTAR_VERSION}}/bundles/datastar.js" -o {{.DATASTAR_JS}}
    status:
      # re-download if missing, still a placeholder, or the pinned version changed
      - grep -q "Datastar v{{.DATASTAR_VERSION}}" {{.DATASTAR_JS}}

  # --- Run ---
  run:
    desc: "Run the compiled binary"
    deps: [build]
    cmds:
      - ./{{.GO_BINARY}}

  watch:
    desc: "Live-reload dev loop (air)"
    deps: [setup]
    cmds:
      - air

  test:
    desc: "Run Go tests with race detection and statement coverage"
    deps: [setup]
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -n 1

  test:cover:
    desc: "Run Go tests and print per-package coverage summary"
    deps: [setup]
    cmds:
      - go test -cover ./...

  test:coverage:
    desc: "Run Go tests and calculate handwritten statement coverage (excludes *_templ.go)"
    deps: [setup]
    cmds:
      - bash scripts/coverage.sh

  test:fast:
    desc: "Run quick Go tests without race detector or coverage profiling"
    deps: [setup]
    cmds:
      - go test ./...

  test:html:
    desc: "Generate HTML coverage report (coverage.html)"
    cmds:
      - task: test
      - go tool cover -html=coverage.out -o coverage.html
      - echo "HTML coverage report generated at coverage.html"

  # --- Image ---
  build:image:
    desc: "Build + push the image, then tag the release. Usage: task build:image TAG=0.28.0"
    deps: [release:check]
    cmds:
      - docker build --build-arg VERSION={{.TAG}} -t {{.IMAGE}}:{{.TAG}} .
      - docker push {{.IMAGE}}:{{.TAG}}
      # Tag last: a tag for an image that never reached the registry points at
      # nothing anyone can run. Pass SKIP_TAG=1 for a throwaway push.
      - task: tag

  release:check:
    desc: "Verify a version can be released from this tree. Usage: task release:check TAG=0.28.0"
    silent: true
    # build:image and tag both depend on this; once per invocation is enough.
    run: once
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'echo "{{.TAG}}" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$"'
        msg: 'TAG must be a semver version such as 0.28.0 — got "{{.TAG}}". The image tag and the git tag are the same string, so a loose one desyncs them.'
      - sh: '[ -n "{{.ALLOW_DIRTY}}" ] || [ -z "$(git status --porcelain)" ]'
        msg: "Working tree is dirty, so a tag here would describe a state no one else can check out. Commit first, or pass ALLOW_DIRTY=1 to build anyway."
      - sh: '! git rev-parse -q --verify "refs/tags/{{.TAG_PREFIX}}{{.TAG}}" >/dev/null || [ "$(git rev-parse "refs/tags/{{.TAG_PREFIX}}{{.TAG}}^{commit}")" = "$(git rev-parse HEAD)" ]'
        msg: "Tag {{.TAG_PREFIX}}{{.TAG}} already exists on a different commit. Pick a new version rather than moving a tag that may already be deployed."
    cmds:
      - 'echo "release:check: {{.TAG}} is releasable from {{.COMMIT}}"'

  tag:
    desc: "Create the annotated git tag for a version. Usage: task tag TAG=0.28.0"
    deps: [release:check]
    status:
      # Already tagged at this commit: nothing to do, so a re-run is harmless.
      - '[ -n "{{.SKIP_TAG}}" ] || [ "$(git rev-parse -q --verify "refs/tags/{{.TAG_PREFIX}}{{.TAG}}^{commit}" 2>/dev/null)" = "$(git rev-parse HEAD)" ]'
    cmds:
      - git tag -a "{{.TAG_PREFIX}}{{.TAG}}" -m "agrelha {{.TAG}}"
      - 'echo "tagged {{.TAG_PREFIX}}{{.TAG}} at {{.COMMIT}} — publish it with: task tag:push TAG={{.TAG}}"'

  tag:push:
    desc: "Push one version tag to the remote. Usage: task tag:push TAG=0.28.0"
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'git rev-parse -q --verify "refs/tags/{{.TAG_PREFIX}}{{.TAG}}" >/dev/null'
        msg: "No local tag {{.TAG_PREFIX}}{{.TAG}} to push — run `task tag TAG={{.TAG}}` first."
    prompt: "Push {{.TAG_PREFIX}}{{.TAG}} to {{.GIT_REMOTE}}? A published tag is effectively permanent."
    cmds:
      - git push {{.GIT_REMOTE}} "{{.TAG_PREFIX}}{{.TAG}}"

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -f {{.GO_BINARY}} {{.CSS_OUT}} coverage.out coverage.html
      - rm -rf node_modules bun.lock tmp
