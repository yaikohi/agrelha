version: "3"

vars:
  CSS_DIR: internal/web/assets/css
  CSS_IN: "{{.CSS_DIR}}/input.css"
  CSS_OUT: "{{.CSS_DIR}}/output.css"
  JS_DIR: internal/web/assets/js
  DATASTAR_JS: "{{.JS_DIR}}/datastar.js"
  DATASTAR_VERSION: 1.0.2
  FONT_DIR: internal/web/assets/fonts
  DEPARTURE_VERSION: 1.500
  FRAUNCES_VERSION: 5.2.6
  GO_MAIN: ./cmd/agrelha
  GO_BINARY: ./tmp/main
  APP_PORT: "8080"
  PROXY_PORT: "7331"
  VERSION: dev
  IMAGE: registry.ykhi.xyz/agrelha
  TAG_PREFIX: v
  GIT_REMOTE: origin
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  DIRTY:
    sh: test -z "$(git status --porcelain 2>/dev/null)" && echo "" || echo "-dirty"
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  default:
    desc: "Build the app and run tests"
    cmds:
      - task: build
      - task: test

  setup:
    desc: "Install missing mise tools (go, bun, templ, air)"
    run: once
    sources:
      - mise.toml
    status:
      - mise status --missing
    cmds:
      - mise install

  # --- Build ---
  build:
    desc: "Generate assets + templ and compile the Go binary"
    deps: [setup, go:build]

  generate:
    desc: "Generate the Go code behind the .templ files"
    deps: [setup]
    sources:
      - "**/*.templ"
    generates:
      - "**/*_templ.go"
    cmds:
      - templ generate

  go:build:
    desc: "Compile the Go binary"
    deps: [generate, tailwind:build, assets:datastar, assets:fonts]
    cmds:
      - >-
        CGO_ENABLED=0 go build -trimpath
        -ldflags "-s -w
        -X agrelha/internal/platform/build.Version={{.VERSION}}
        -X agrelha/internal/platform/build.Commit={{.COMMIT}}{{.DIRTY}}
        -X agrelha/internal/platform/build.Date={{.BUILD_DATE}}"
        -o {{.GO_BINARY}} {{.GO_MAIN}}

  version:
    desc: "Print what a build would stamp right now"
    silent: true
    cmds:
      - 'echo "version={{.VERSION}} commit={{.COMMIT}}{{.DIRTY}} date={{.BUILD_DATE}}"'

  tailwind:build:
    desc: "Build Tailwind CSS (v4 CLI)"
    deps: [setup, tailwind:deps]
    sources:
      - "{{.CSS_IN}}"
      - "**/*.templ"
      - "**/*.go"
    generates:
      - "{{.CSS_OUT}}"
    cmds:
      - mkdir -p {{.CSS_DIR}}
      - bunx @tailwindcss/cli -i {{.CSS_IN}} -o {{.CSS_OUT}} --minify

  tailwind:deps:
    desc: "Install node modules with bun"
    deps: [setup]
    sources:
      - package.json
    generates:
      - bun.lock
    cmds:
      - bun install

  assets:datastar:
    desc: "Vendor pinned Datastar bundle"
    status:
      - test -s {{.DATASTAR_JS}} && grep -q "Datastar v{{.DATASTAR_VERSION}}" {{.DATASTAR_JS}}
    cmds:
      - mkdir -p {{.JS_DIR}}
      - curl -fsSL "https://cdn.jsdelivr.net/gh/starfederation/datastar@v{{.DATASTAR_VERSION}}/bundles/datastar.js" -o {{.DATASTAR_JS}}

  assets:fonts:
    desc: "Vendor pinned web fonts"
    status:
      - test -s {{.FONT_DIR}}/DepartureMono-Regular.woff2
      - test -s {{.FONT_DIR}}/Fraunces-Variable.woff2
    cmds:
      - mkdir -p {{.FONT_DIR}}
      - curl -fsSL "https://cdn.jsdelivr.net/gh/rektdeckard/departure-mono@v{{.DEPARTURE_VERSION}}/public/assets/DepartureMono-Regular.woff2" -o {{.FONT_DIR}}/DepartureMono-Regular.woff2
      - curl -fsSL "https://cdn.jsdelivr.net/npm/@fontsource-variable/fraunces@{{.FRAUNCES_VERSION}}/files/fraunces-latin-wght-normal.woff2" -o {{.FONT_DIR}}/Fraunces-Variable.woff2

  # --- Dev Loop ---
  run:
    desc: "Run the full live-reload dev loop"
    deps: [setup, assets:datastar, assets:fonts, tailwind:deps]
    cmds:
      - task: dev

  dev:
    desc: "Run Tailwind, Templ, and Go server concurrently"
    deps:
      - tailwind:watch
      - templ:watch
      - go:watch

  tailwind:watch:
    desc: "Watch and build Tailwind CSS"
    deps: [setup, tailwind:deps]
    cmds:
      # Removed --poll for lower CPU usage. Add --poll back only if developing inside a mounted VM/Docker
      - mkdir -p {{.CSS_DIR}}
      - bunx @tailwindcss/cli -i {{.CSS_IN}} -o {{.CSS_OUT}} --watch

  templ:watch:
    desc: "Watch templ files and notify proxy"
    deps: [setup]
    cmds:
      - templ generate --watch --proxy="http://localhost:{{.APP_PORT}}" --proxyport="{{.PROXY_PORT}}" --open-browser=false

  go:watch:
    desc: "Live-reload Go backend via air"
    deps: [setup, generate]
    cmds:
      - air

  # --- Quality & Test ---
  vet:
    desc: "Run go vet across the module"
    deps: [setup, generate]
    cmds:
      - go vet ./...

  test:
    desc: "Run Go tests with race detection and statement coverage"
    deps: [setup, generate]
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -n 1

  test:cover:
    desc: "Run Go tests and print per-package coverage summary"
    deps: [setup, generate]
    cmds:
      - go test -cover ./...

  test:coverage:
    desc: "Run Go tests and calculate handwritten statement coverage (excludes *_templ.go)"
    deps: [setup, generate]
    cmds:
      - bash scripts/coverage.sh

  test:fast:
    desc: "Run quick Go tests without race detector or coverage profiling"
    deps: [setup, generate]
    cmds:
      - go test ./...

  test:html:
    desc: "Generate HTML coverage report (coverage.html)"
    cmds:
      - task: test
      - go tool cover -html=coverage.out -o coverage.html
      - echo "HTML coverage report generated at coverage.html"

  # --- Image & Release ---
  build:image:
    desc: "Build + push the image, then tag the release. Usage: task build:image TAG=0.28.0"
    deps: [release:check]
    cmds:
      - docker build --build-arg VERSION={{.TAG}} -t {{.IMAGE}}:{{.TAG}} .
      - docker push {{.IMAGE}}:{{.TAG}}
      - task: tag

  release:check:
    desc: "Verify a version can be released from this tree. Usage: task release:check TAG=0.28.0"
    silent: true
    run: once
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'echo "{{.TAG}}" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$"'
        msg: 'TAG must be a semver version such as 0.28.0 — got "{{.TAG}}".'
      - sh: '[ -n "{{.ALLOW_DIRTY}}" ] || [ -z "$(git status --porcelain)" ]'
        msg: "Working tree is dirty. Commit first, or pass ALLOW_DIRTY=1."
      - sh: '! git rev-parse -q --verify "refs/tags/{{.TAG_PREFIX}}{{.TAG}}" >/dev/null || [ "$(git rev-parse "refs/tags/{{.TAG_PREFIX}}{{.TAG}}^{commit}")" = "$(git rev-parse HEAD)" ]'
        msg: "Tag {{.TAG_PREFIX}}{{.TAG}} already exists on a different commit."
    cmds:
      - 'echo "release:check: {{.TAG}} is releasable from {{.COMMIT}}"'

  tag:
    desc: "Create the annotated git tag for a version. Usage: task tag TAG=0.28.0"
    deps: [release:check]
    status:
      - '[ -n "{{.SKIP_TAG}}" ] || [ "$(git rev-parse -q --verify "refs/tags/{{.TAG_PREFIX}}{{.TAG}}^{commit}" 2>/dev/null)" = "$(git rev-parse HEAD)" ]'
    cmds:
      - git tag -a "{{.TAG_PREFIX}}{{.TAG}}" -m "agrelha {{.TAG}}"
      - 'echo "tagged {{.TAG_PREFIX}}{{.TAG}} at {{.COMMIT}} — publish it with: task tag:push TAG={{.TAG}}"'

  tag:push:
    desc: "Push one version tag to the remote. Usage: task tag:push TAG=0.28.0"
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'git rev-parse -q --verify "refs/tags/{{.TAG_PREFIX}}{{.TAG}}" >/dev/null'
        msg: "No local tag {{.TAG_PREFIX}}{{.TAG}} to push."
    prompt: "Push {{.TAG_PREFIX}}{{.TAG}} to {{.GIT_REMOTE}}? A published tag is effectively permanent."
    cmds:
      - git push {{.GIT_REMOTE}} "{{.TAG_PREFIX}}{{.TAG}}"

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -f {{.GO_BINARY}} {{.CSS_OUT}} coverage