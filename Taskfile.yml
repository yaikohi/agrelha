version: "3"

vars:
  CSS_IN: internal/web/assets/css/input.css
  CSS_OUT: internal/web/assets/css/output.css
  DATASTAR_JS: internal/web/assets/js/datastar.js
  DATASTAR_VERSION: 1.0.2 # must match datastar-go protocol (PatchElements/PatchSignals)
  GO_MAIN: cmd/agrelha/main.go
  GO_BINARY: main
  VERSION: dev
  IMAGE: registry.ykhi.xyz/agrelha

tasks:
  default:
    desc: "Build the app and run tests"
    cmds:
      - task: build
      - task: test

  setup:
    desc: "Install missing mise tools (go, bun, templ, air)"
    cmds:
      - mise install
    status:
      - mise status --missing
    sources:
      - mise.toml

  # --- Build ---
  build:
    desc: "Generate assets + templ and compile the Go binary"
    deps: [setup, go:build]

  go:build:
    desc: "templ generate + go build"
    deps: [tailwind:build, assets:datastar]
    cmds:
      - templ generate
      - go build -ldflags "-X agrelha/internal/platform/build.Version={{.VERSION}}" -o {{.GO_BINARY}} {{.GO_MAIN}}
    sources:
      - "**/*.go"
      - "**/*.templ"
      - "{{.CSS_IN}}"
    generates:
      - "{{.GO_BINARY}}"

  tailwind:build:
    desc: "Build Tailwind CSS (v4 CLI)"
    deps: [setup, tailwind:deps]
    cmds:
      - bunx @tailwindcss/cli -i {{.CSS_IN}} -o {{.CSS_OUT}} --minify

  tailwind:deps:
    desc: "Install node modules with bun"
    deps: [setup]
    cmds:
      - bun install
    sources:
      - "package.json"
    generates:
      - "bun.lock"

  assets:datastar:
    desc: "Vendor the pinned Datastar browser bundle (no CDN at runtime)"
    cmds:
      - curl -fsSL "https://cdn.jsdelivr.net/gh/starfederation/datastar@v{{.DATASTAR_VERSION}}/bundles/datastar.js" -o {{.DATASTAR_JS}}
    status:
      # re-download if missing, still a placeholder, or the pinned version changed
      - grep -q "Datastar v{{.DATASTAR_VERSION}}" {{.DATASTAR_JS}}

  # --- Run ---
  run:
    desc: "Run the compiled binary"
    deps: [build]
    cmds:
      - ./{{.GO_BINARY}}

  watch:
    desc: "Live-reload dev loop (air)"
    deps: [setup]
    cmds:
      - air

  test:
    desc: "Run Go tests with race detection and statement coverage"
    deps: [setup]
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -n 1

  test:cover:
    desc: "Run Go tests and print per-package coverage summary"
    deps: [setup]
    cmds:
      - go test -cover ./...

  test:coverage:
    desc: "Run Go tests and calculate handwritten statement coverage (excludes *_templ.go)"
    deps: [setup]
    cmds:
      - bash scripts/coverage.sh

  test:fast:
    desc: "Run quick Go tests without race detector or coverage profiling"
    deps: [setup]
    cmds:
      - go test ./...

  test:html:
    desc: "Generate HTML coverage report (coverage.html)"
    cmds:
      - task: test
      - go tool cover -html=coverage.out -o coverage.html
      - echo "HTML coverage report generated at coverage.html"

  # --- Image ---
  build:image:
    desc: "Build + push the container image to Zot. Usage: task build:image TAG=0.1.0"
    vars:
      TAG: '{{.TAG | default "dev"}}'
    cmds:
      - docker build --build-arg VERSION={{.TAG}} -t {{.IMAGE}}:{{.TAG}} .
      - docker push {{.IMAGE}}:{{.TAG}}

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -f {{.GO_BINARY}} {{.CSS_OUT}} coverage.out coverage.html
      - rm -rf node_modules bun.lock tmp
