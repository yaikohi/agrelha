name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Resolve Go cache paths
        id: gocache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.mod }}
            ${{ steps.gocache.outputs.build }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Download modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt), retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: Vet
        run: task vet

      - name: Test
        run: task test
